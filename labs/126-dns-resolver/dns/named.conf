options {
    directory "/var/cache/bind";
    listen-on port 5353 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
};

zone "empresa.lab" {
    type primary;
    file "empresa.lab.zone";
    dnssec-policy default;
    inline-signing yes;
    key-directory "keys";
};

zone "0.126.10.in-addr.arpa" {
    type primary;
    file "0.126.10.zone";
};
