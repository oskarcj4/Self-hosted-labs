services:
  lab:
    build:
      context: .
    container_name: tc-lab-111
    hostname: srv-prod-01
    privileged: true      # systemd real dentro del contenedor
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    volumes:
      - offsite:/mnt/offsite   # "otro servidor": volumen aparte del contenedor
    ports:
      - "127.0.0.1:7711:7681"   # terminal web (ttyd)
volumes:
  offsite:
