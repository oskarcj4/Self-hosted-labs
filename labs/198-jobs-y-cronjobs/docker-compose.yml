services:
  lab:
    build:
      context: .
    container_name: tc-lab-198
    hostname: k8s-198
    privileged: true      # systemd + Kubernetes (k3s) dentro del contenedor
    cgroup: private
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    ports:
      - "127.0.0.1:7798:7681"   # terminal web (ttyd)
