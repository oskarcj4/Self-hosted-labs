services:
  lab:
    build:
      context: .
    container_name: tc-lab-72
    hostname: shop-03
    privileged: true      # systemd real dentro del contenedor
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    ports:
      - "127.0.0.1:7672:7681"   # terminal web (ttyd)
