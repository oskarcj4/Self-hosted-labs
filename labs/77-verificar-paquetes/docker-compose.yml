services:
  lab:
    build:
      context: .
    container_name: tc-lab-77
    hostname: ci-01
    privileged: true      # systemd real dentro del contenedor
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    depends_on:
      - artifacts
    networks:
      lan:
        ipv4_address: 10.76.77.10
    ports:
      - "127.0.0.1:7677:7681"   # terminal web (ttyd)

  # Mirror interno de artefactos (comprometido).
  artifacts:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: tc-lab-77-artifacts
    hostname: artifacts
    networks:
      lan:
        ipv4_address: 10.76.77.20
        aliases:
          - artifacts.interno

networks:
  lan:
    ipam:
      config:
        - subnet: 10.76.77.0/24
