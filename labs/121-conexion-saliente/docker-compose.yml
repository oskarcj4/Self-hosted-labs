services:
  lab:
    build:
      context: .
    container_name: tc-lab-121
    hostname: web-121
    privileged: true      # systemd real dentro del contenedor
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    networks:
      inet:
        ipv4_address: 198.51.100.10
    ports:
      - "127.0.0.1:7721:7681"   # terminal web (ttyd)
  # Servidor de mando y control (C2) "en Internet": acepta y mantiene la conexión.
  c2:
    image: busybox:1.36
    container_name: tc-lab-121-c2
    command: ["sh", "-c", "while :; do tail -f /dev/null | nc -l -p 6667 > /dev/null; done"]
    networks:
      inet:
        ipv4_address: 198.51.100.66
networks:
  inet:
    ipam:
      config:
        - subnet: 198.51.100.0/24
