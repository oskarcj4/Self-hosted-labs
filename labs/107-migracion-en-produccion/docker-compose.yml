services:
  lab:
    build:
      context: .
    container_name: tc-lab-107
    hostname: shop-01
    privileged: true          # systemd real dentro del contenedor
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    ports:
      - "127.0.0.1:7707:7681"  # terminal web (ttyd)
