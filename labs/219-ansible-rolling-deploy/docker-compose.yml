services:
  lab:
    build:
      context: .
    container_name: tc-lab-219
    hostname: prod-219
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    ports:
      - "127.0.0.1:7819:7681"   # terminal web (ttyd)
      - "127.0.0.1:8219:8080"   # la web (HAProxy)
