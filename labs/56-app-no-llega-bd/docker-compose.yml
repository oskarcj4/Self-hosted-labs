services:
  lab:
    build:
      context: .
    container_name: tc-lab-56
    hostname: app-01
    privileged: true      # systemd real dentro del contenedor
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    depends_on:
      - db
    networks:
      lan:
        ipv4_address: 10.76.56.10
    ports:
      - "127.0.0.1:7656:7681"   # terminal web (ttyd)

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: tc-lab-56-db
    hostname: db-01
    privileged: true      # systemd + iptables
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    networks:
      lan:
        ipv4_address: 10.76.56.20

networks:
  lan:
    ipam:
      config:
        - subnet: 10.76.56.0/24
