#!/usr/sbin/nft -f
# Cortafuegos de fw-01 (nativo nftables). Fuente única: este fichero.
flush ruleset

table inet filter {
    # Redes de administración (SSH). Edítalo aquí, no en cada regla.
    set admin_nets {
        type ipv4_addr
        flags interval
        elements = { 10.76.78.0/24, 192.168.10.0/24 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH: sólo desde administración y con freno a la fuerza bruta.
        ip saddr @admin_nets tcp dport 22 ct state new \
            limit rate 10/minute burst 5 packets accept

        # Consola web (ttyd). Sin esto se pierde la terminal del lab.
        tcp dport 7681 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
