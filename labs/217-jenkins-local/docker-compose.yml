services:
  lab:
    build:
      context: .
    container_name: tc-lab-217
    hostname: jenkins-217
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    ports:
      - "127.0.0.1:7817:7681"   # terminal web (ttyd)
      - "127.0.0.1:8217:8080"   # Jenkins: http://localhost:8217
