services:
  lab:
    build:
      context: .
    container_name: tc-lab-197
    hostname: k8s-197
    privileged: true      # systemd + Kubernetes (k3s) dentro del contenedor
    cgroup: private
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    ports:
      - "127.0.0.1:7797:7681"   # terminal web (ttyd)
  nodo2:
    build:
      context: .
    container_name: tc-lab-197-nodo2
    hostname: k8s-197-nodo2
    privileged: true      # segundo nodo de Kubernetes (agente k3s)
    cgroup: private
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
