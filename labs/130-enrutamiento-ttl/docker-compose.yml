# Topología:
#   pc-oficina 10.130.1.20 ── [lab: router-130] ── r2-dmz ── srv-dmz 10.130.3.30
#                 10.130.1.254 | 10.130.2.254   10.130.2.253 | 10.130.3.253
services:
  lab:
    build:
      context: .
    container_name: tc-lab-130
    hostname: router-130
    privileged: true      # systemd real dentro del contenedor
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    volumes:
      - estado:/srv/estado:ro
    networks:
      oficina: {ipv4_address: 10.130.1.254}
      servidores: {ipv4_address: 10.130.2.254}
    ports:
      - "127.0.0.1:7730:7681"   # terminal web (ttyd)

  # Un PC de la oficina que intenta llegar al servidor de la DMZ cada 5 s.
  pc:
    image: alpine:3.20
    container_name: tc-lab-130-pc
    hostname: pc-oficina
    cap_add: [NET_ADMIN]
    volumes:
      - estado:/estado
    command: ["sh", "-c", "ip route add 10.130.0.0/16 via 10.130.1.254; while :; do if ping -c 2 -W 1 10.130.3.30 > /tmp/p 2>&1; then r=OK; else r=FALLA; fi; { echo \"$$r $$(date -u +%s)\"; cat /tmp/p; } > /estado/pc.txt; sleep 5; done"]
    networks:
      oficina: {ipv4_address: 10.130.1.20}

  r2:
    image: alpine:3.20
    container_name: tc-lab-130-r2
    hostname: r2-dmz
    cap_add: [NET_ADMIN]
    sysctls: {net.ipv4.ip_forward: 1}
    command: ["sh", "-c", "ip route add 10.130.1.0/24 via 10.130.2.254; exec sleep infinity"]
    networks:
      servidores: {ipv4_address: 10.130.2.253}
      dmz: {ipv4_address: 10.130.3.253}

  srv:
    image: alpine:3.20
    container_name: tc-lab-130-srv
    hostname: srv-dmz
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "ip route add 10.130.0.0/16 via 10.130.3.253; exec sleep infinity"]
    networks:
      dmz: {ipv4_address: 10.130.3.30}

networks:
  oficina:
    ipam: {config: [{subnet: 10.130.1.0/24}]}
  servidores:
    ipam: {config: [{subnet: 10.130.2.0/24}]}
  dmz:
    ipam: {config: [{subnet: 10.130.3.0/24}]}
volumes:
  estado:
