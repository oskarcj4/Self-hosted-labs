services:
  lab:
    build:
      context: .
    container_name: tc-lab-47
    hostname: hooks-host
    privileged: true      # Docker-in-Docker: el lab tiene su propio dockerd
    init: true            # tini como PID 1 (recoge procesos huérfanos)
    ports:
      - "127.0.0.1:7647:7681"   # terminal web (ttyd)
