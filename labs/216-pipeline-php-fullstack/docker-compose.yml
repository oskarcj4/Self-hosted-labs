services:
  lab:
    build:
      context: .
    container_name: tc-lab-216
    hostname: ci-216
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    ports:
      - "127.0.0.1:7816:7681"   # terminal web (ttyd)
      - "127.0.0.1:4216:4216"   # Gitea (web y API): http://localhost:4216
      - "127.0.0.1:8216:8080"   # la web desplegada: http://localhost:8216
